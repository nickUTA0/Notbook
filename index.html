<style>
/* Layout: uma tela de computador completa. Papel de parede, ícones à esquerda, barra de tarefas centralizada, menu iniciar e janelas arrastáveis. */
:root {

* { box-sizing: border-box; }
html, body { height: 100%; }

button { font: inherit; color: inherit; }
#desk { position: fixed; inset: 0; overflow: hidden; }
#wall { position: absolute; inset: 0; background:
  radial-gradient(60% 50% at 70% 62%, rgba(255,196,120,.55), rgba(255,196,120,0) 70%),
  linear-gradient(175deg, #0b1626 0%, #17344a 38%, #2f6a72 66%, #d7a46a 100%); }
#wall svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 62%; }

.di svg { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.di:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.12); }

.win { position: absolute; display: flex; flex-direction: column; background: var(--win); border: 1px solid rgba(255,255,255,.14); border-radius: 9px; box-shadow: 0 10px 34px rgba(0,0,0,.5); overflow: hidden; min-width: 280px; min-height: 160px; animation: pop .16s ease-out; }

.web .pg { flex: 1; overflow: auto; background: linear-gradient(180deg, #e9f4ee, #fff 60%); padding: 28px 24px; } .web h2 { margin: 0 0 6px; font: 700 26px/1.15 var(--font); color: #1f4a35; } .web p { margin: 0 0 18px; max-width: 46ch; color: #3c5246; } .web .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; } .web .tiles div { background: #fff; border: 1px solid #d5e4da; border-radius: 10px; padding: 14px; font-size: 13px; } .web .tiles b { display: block; color: #1f4a35; margin-bottom: 4px; }
.web .go { display: inline-block; background: #2f7a52; color: #fff; padding: 9px 18px; border-radius: 6px; margin-bottom: 22px; }

.set { display: grid; grid-template-columns: 190px 1fr; height: 100%; } .set nav { padding: 10px 8px; border-right: 1px solid var(--line); overflow: auto; } .set nav div { padding: 8px 12px; border-radius: 6px; font-size: 13px; } .set nav div.on { background: var(--hover); } .set .pn { padding: 18px 22px; overflow: auto; } .set h3 { margin: 0 0 14px; font: 600 20px var(--font); }

.tg { width: 40px; height: 20px; border-radius: 10px; border: 1px solid #8a9099; background: none; position: relative; flex: none; } .tg::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #c8ccd2; transition: left .15s; } .tg[aria-checked="true"] { background: var(--accent); border-color: var(--accent); } .tg[aria-checked="true"]::after { left: 23px; background: #0b1b30; }
input[type=range] { accent-color: var(--accent); width: 150px; }
.cal { padding: 14px 18px; } .cal h3 { margin: 0 0 10px; font: 600 18px var(--font); text-transform: capitalize; } .cal .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; } .cal .g span { padding: 8px 0; border-radius: 50%; font-size: 13px; } .cal .g .h { color: var(--ink3); font-size: 11.5px; } .cal .g .td { background: var(--accent2); color: #fff; font-weight: 600; } .cal .g .o { color: var(--ink3); }
.clockw { display: grid; place-items: center; height: 100%; gap: 6px; padding: 14px; align-content: center; } .clockw svg { width: 150px; height: 150px; } .clockw b { font: 300 38px var(--font); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

.ph { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; padding: 6px; } .ph div { aspect-ratio: 4 / 3; border-radius: 4px; display: flex; align-items: flex-end; padding: 6px 8px; font-size: 11.5px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.paint { display: flex; flex-direction: column; height: 100%; } .paint .tl { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: var(--win2); border-bottom: 1px solid var(--line); flex-wrap: wrap; } .paint .sw { width: 22px; height: 22px; border-radius: 4px; border: 2px solid transparent; padding: 0; } .paint .sw.on { border-color: #fff; } .paint canvas { flex: 1; min-height: 0; width: 100%; background: #fff; touch-action: none; cursor: crosshair; display: block; }

#ctx div { padding: 7px 12px; border-radius: 5px; } #ctx div:hover { background: var(--hover); } #ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
#toast { position: absolute; right: 14px; bottom: calc(var(--tb) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 5500; background: rgba(34,38,44,.96); border: 1px solid rgba(255,255,255,.14); border-radius: 9px; padding: 12px 16px; max-width: 280px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); transform: translateX(120%); transition: transform .25s; } #toast.on { transform: none; } #toast b { display: block; margin-bottom: 2px; }

    if (!w) openApp(id); else if (w.el.classList.contains('min')) { w.el.classList.remove('min'); focusWin(id); } else if (focusId === id) { w.el.classList.add('min'); focusWin(null); } else focusWin(id);
  });
  $('#show').addEventListener('click', function () { var anyOpen = Object.keys(wins).some(function (k) { return !wins[k].el.classList.contains('min'); }); Object.keys(wins).forEach(function (k) { wins[k].el.classList.toggle('min', anyOpen); }); focusWin(null); });

  /* ---------- menu iniciar ---------- */
  var start = $('#start'), sin = $('#sin');
  function toggleStart(focus) { if (start.classList.contains('on') && !focus) closeStart(); else { start.classList.add('on'); sin.value = ''; filter(''); setTimeout(function () { sin.focus(); }, 60); } }
  function closeStart() { start.classList.remove('on'); }
  var pinned = APPS.slice();
  function sapp(a) { return '<button type="button" class="sa" data-id="' + a.id + '">' + icon(a.ic) + '<span>' + esc(a.name) + '</span></button>'; }
  $('#sg').innerHTML = pinned.map(sapp).join('');
  var REC = [['docx', 'Convite_Dino_Vale.docx', 'Documentos · há 2 h'], ['img', 'mapa_parque.png', 'Downloads · ontem'], ['txt', 'Lista_de_Malas.txt', 'Documentos · segunda'], ['docx', 'Relatorio_Viagem.docx', 'Documentos · domingo']];
  $('#sr').innerHTML = REC.map(function (r) { return '<button type="button" class="sri"><svg viewBox="0 0 48 48">' + IC[r[0]] + '</svg><div><b>' + esc(r[1]) + '</b><small>' + esc(r[2]) + '</small></div></button>'; }).join('');
  function filter(q) {
    q = q.trim().toLowerCase();
    if (!q) { $('#s1').style.display = ''; $('#nores').style.display = 'none'; $('#sg').innerHTML = pinned.map(sapp).join(''); return; }
    var r = APPS.filter(function (a) { return a.name.toLowerCase().indexOf(q) >= 0; });
    $('#s1').style.display = ''; $('#sr').parentNode.querySelectorAll('.sh').forEach(function (h) { h.style.display = 'none'; }); $('#sr').style.display = 'none';
    $('#sg').innerHTML = r.map(sapp).join(''); $('#nores').style.display = r.length ? 'none' : 'block';
  }
  sin.addEventListener('input', function () {
    var empty = !sin.value.trim(); [].forEach.call(document.querySelectorAll('#s1 .sh'), function (h) { h.style.display = empty ? '' : 'none'; }); $('#sr').style.display = empty ? '' : 'none'; filter(sin.value);
  });
  sin.addEventListener('keydown', function (e) { if (e.key === 'Enter') { var f = $('#sg .sa'); if (f) openApp(f.dataset.id); } });
  $('#sg').addEventListener('click', function (e) { var a = e.target.closest('.sa'); if (a) openApp(a.dataset.id); });
  $('#sr').addEventListener('click', function (e) { if (e.target.closest('.sri')) { closeStart(); openApp('note'); } });
  $('#pwr').addEventListener('click', function () { closeStart(); toast('Desligar', 'Esta é só uma prévia: o computador continua ligado.'); });
  $('#usr').addEventListener('click', function () { closeStart(); toast('Miguel', 'Conta local · administrador'); });
  document.addEventListener('pointerdown', function (e) { if (start.classList.contains('on') && !e.target.closest('#start') && !e.target.closest('#sbtn') && !e.target.closest('#sq')) closeStart(); if (!e.target.closest('#ctx')) $('#ctx').style.display = 'none'; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeStart(); $('#ctx').style.display = 'none'; } if (e.key === 'Meta' || (e.key === 'F10' && e.shiftKey)) toggleStart(); });

  /* ---------- área de trabalho ---------- */
  var icons = $('#icons'), coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  APPS.filter(function (a) { return a.desk; }).forEach(function (a) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'di'; b.dataset.id = a.id; b.setAttribute('role', 'listitem'); b.innerHTML = icon(a.ic) + '<span>' + esc(a.name) + '</span>'; icons.appendChild(b);
  });
  icons.addEventListener('click', function (e) { var b = e.target.closest('.di'); if (!b) return; [].forEach.call(icons.children, function (x) { x.classList.toggle('sel', x === b); }); if (coarse) openApp(b.dataset.id); });
  icons.addEventListener('dblclick', function (e) { var b = e.target.closest('.di'); if (b) openApp(b.dataset.id); });
  icons.addEventListener('keydown', function (e) { if (e.key === 'Enter') { var b = e.target.closest('.di'); if (b) openApp(b.dataset.id); } });
  $('#wall').addEventListener('pointerdown', function () { [].forEach.call(icons.children, function (x) { x.classList.remove('sel'); }); focusWin(null); });
  $('#desk').addEventListener('pointerdown', function (e) { if (e.target === $('#icons') || e.target === $('#wins')) { [].forEach.call(icons.children, function (x) { x.classList.remove('sel'); }); } });

  var ctx = $('#ctx');
  $('#desk').addEventListener('contextmenu', function (e) {
    if (e.target.closest('.win') || e.target.closest('#tb') || e.target.closest('#start')) return; e.preventDefault();
    ctx.innerHTML = '<div data-a="ref">Atualizar</div><hr><div data-a="set">Configurações de exibição</div><div data-a="set">Personalizar</div><hr><div data-a="note">Novo documento de texto</div><div data-a="term">Abrir no Terminal</div>';
    ctx.style.display = 'block'; var r = $('#desk').getBoundingClientRect();
    ctx.style.left = Math.min(e.clientX - r.left, r.width - 214) + 'px'; ctx.style.top = Math.min(e.clientY - r.top, r.height - 220) + 'px';
  });
  ctx.addEventListener('click', function (e) { var d = e.target.closest('[data-a]'); ctx.style.display = 'none'; if (!d) return; var a = d.dataset.a; if (a === 'ref') { $('#icons').style.opacity = 0; setTimeout(function () { $('#icons').style.opacity = 1; }, 120); } else openApp(a); });

  var toastEl = $('#toast'), toastT = null;
  function toast(t, m) { toastEl.innerHTML = '<b>' + esc(t) + '</b>' + esc(m); toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 3200); }

  function clock() { var d = NOW(); $('#c1').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()); $('#c2').textContent = pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
  clock(); setInterval(clock, 5000);
  drawTb();
  // abre uma janela de exemplo para a prévia
  setTimeout(function () { if (!isNarrow()) { openApp('exp'); } }, 150);
  window.addEventListener('resize', function () { Object.keys(wins).forEach(function (k) { var el = wins[k].el; el.style.resize = isNarrow() ? 'none' : 'both'; if (isNarrow()) el.classList.add('max'); }); });
})();
</script>

</body></html>
